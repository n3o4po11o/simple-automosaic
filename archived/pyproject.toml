[project]
name = "automosaic"
version = "0.1.0"
description = "M1 Max GPU (MPS) accelerated face & body masking for video via YOLO"
readme = "README.md"
requires-python = ">=3.9,<3.14"
authors = [{ name = "automosaic" }]
dependencies = [
    "ultralytics>=8.3.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
]

[project.scripts]
automosaic = "automosaic.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["automosaic*"]
